name: Online Visual QA Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/online-visual-qa.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://ajiangpz.github.io/sz-weather/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture desktop viewports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-qa/desktop visual-qa/wind

          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1920,1080" --wait-for-timeout 8000 --full-page "$TARGET_URL" visual-qa/desktop/1920x1080.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1536,1024" --wait-for-timeout 8000 --full-page "$TARGET_URL" visual-qa/desktop/1536x1024.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1440,900" --wait-for-timeout 8000 --full-page "$TARGET_URL" visual-qa/desktop/1440x900.png

      - name: Capture wind multi-frame samples
        shell: bash
        run: |
          set -euo pipefail
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1536,1024" --wait-for-timeout 8000 --full-page "$TARGET_URL" visual-qa/wind/frame-0000ms.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1536,1024" --wait-for-timeout 8120 --full-page "$TARGET_URL" visual-qa/wind/frame-0120ms.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1536,1024" --wait-for-timeout 8240 --full-page "$TARGET_URL" visual-qa/wind/frame-0240ms.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1536,1024" --wait-for-timeout 8600 --full-page "$TARGET_URL" visual-qa/wind/frame-0600ms.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1536,1024" --wait-for-timeout 9800 --full-page "$TARGET_URL" visual-qa/wind/frame-1800ms.png

      - name: Sanity-check screenshots
        shell: bash
        run: |
          set -euo pipefail
          expected=8
          actual=$(find visual-qa -type f -name '*.png' | wc -l)
          test "$actual" -eq "$expected"
          while IFS= read -r file; do
            size=$(stat -c%s "$file")
            echo "$file: $size bytes"
            test "$size" -gt 50000
          done < <(find visual-qa -type f -name '*.png' | sort)

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-visual-qa-evidence
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
