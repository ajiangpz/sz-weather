name: Branch Chromium QA

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to validate
        required: true
        default: deckGL
        type: string
  push:
    branches-ignore:
      - deckGL

permissions:
  contents: read
  statuses: write

concurrency:
  group: branch-chromium-qa-${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref_name }}
      QA_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Publish Chromium QA run locator
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TARGET_SHA="$(git rev-parse HEAD)"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "RUN_URL=$RUN_URL" >> "$GITHUB_ENV"

          curl --fail --silent --show-error \
            --request POST \
            --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"state\":\"pending\",\"target_url\":\"$RUN_URL\",\"description\":\"Branch Chromium QA running (attempt $GITHUB_RUN_ATTEMPT)\",\"context\":\"branch-chromium-qa\"}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm --version

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm verify

      - name: Install Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run existing Chromium E2E
        run: pnpm test:e2e

      - name: Start local production preview
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm preview --host 127.0.0.1 --port 4173 > /tmp/rainscope-preview.log 2>&1 &
          echo $! > /tmp/rainscope-preview.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$QA_BASE_URL" >/dev/null; then
              echo "Preview ready at $QA_BASE_URL"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/rainscope-preview.log || true
          exit 1

      - name: Capture real Chromium visual QA evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-qa/desktop visual-qa/wind

          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';

          const baseUrl = process.env.QA_BASE_URL;
          const targetRef = process.env.TARGET_REF;
          const browser = await chromium.launch({ headless: true });
          const summary = {
            targetRef,
            commit: process.env.GITHUB_SHA,
            viewports: [],
            dynamicFrames: [],
          };

          async function openReadyPage(width, height) {
            const page = await browser.newPage({ viewport: { width, height } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto(baseUrl, { waitUntil: 'domcontentloaded', timeout: 60_000 });
            await page.waitForTimeout(5_000);
            if (pageErrors.length > 0) {
              throw new Error(`Page errors at ${width}x${height}: ${pageErrors.join(' | ')}`);
            }
            return page;
          }

          for (const [width, height] of [[1920, 1080], [1536, 1024], [1440, 900]]) {
            const page = await openReadyPage(width, height);
            const dashboard = page.locator('.weather-dashboard');
            const header = page.locator('.weather-header');
            const actionButtons = page.locator('.weather-header__actions button');

            if (await dashboard.count() !== 1 || await header.count() !== 1) {
              throw new Error(`Dashboard/header missing at ${width}x${height}`);
            }
            if (await actionButtons.count() !== 2) {
              throw new Error(`Expected 2 header action buttons at ${width}x${height}`);
            }

            const actions = await actionButtons.evaluateAll(buttons => buttons.map(button => {
              const label = button.querySelector('span');
              const labelRects = label ? label.getClientRects().length : 0;
              const style = getComputedStyle(button);
              const rect = button.getBoundingClientRect();
              return {
                text: label?.textContent?.trim() ?? '',
                labelRects,
                whiteSpace: style.whiteSpace,
                width: rect.width,
                height: rect.height,
              };
            }));

            for (const action of actions) {
              if (action.labelRects !== 1) {
                throw new Error(`Header action "${action.text}" wraps at ${width}x${height}`);
              }
            }

            const layout = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              scrollHeight: document.documentElement.scrollHeight,
              clientHeight: document.documentElement.clientHeight,
            }));

            if (layout.scrollWidth > layout.clientWidth + 1) {
              throw new Error(`Horizontal overflow at ${width}x${height}: ${layout.scrollWidth} > ${layout.clientWidth}`);
            }

            await page.screenshot({
              path: path.join('visual-qa', 'desktop', `${width}x${height}.png`),
              fullPage: true,
            });

            summary.viewports.push({ width, height, actions, layout });
            await page.close();
          }

          const windPage = await openReadyPage(1536, 1024);
          const windToggle = windPage.getByLabel('风场流线');
          if (await windToggle.count() === 1) {
            if (!(await windToggle.isChecked())) {
              await windToggle.check();
            }
            await windPage.waitForTimeout(600);

            const samples = [
              ['0000ms', 0],
              ['0120ms', 120],
              ['0240ms', 120],
              ['0600ms', 360],
              ['1800ms', 1200],
            ];

            for (const [name, waitMs] of samples) {
              if (waitMs > 0) await windPage.waitForTimeout(waitMs);
              const file = path.join('visual-qa', 'wind', `frame-${name}.png`);
              await windPage.screenshot({ path: file, fullPage: true });
              summary.dynamicFrames.push(file);
            }
          }
          await windPage.close();
          await browser.close();

          fs.writeFileSync('visual-qa/qa-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          NODE

      - name: Sanity-check visual artifacts
        shell: bash
        run: |
          set -euo pipefail

          desktop_count=$(find visual-qa/desktop -type f -name '*.png' | wc -l)
          test "$desktop_count" -eq 3

          while IFS= read -r file; do
            size=$(stat -c%s "$file")
            echo "$file: $size bytes"
            test "$size" -gt 50000
          done < <(find visual-qa -type f -name '*.png' | sort)

          wind_count=$(find visual-qa/wind -type f -name '*.png' | wc -l)
          if [ "$wind_count" -gt 1 ]; then
            unique_wind_frames=$(sha256sum visual-qa/wind/*.png | awk '{print $1}' | sort -u | wc -l)
            echo "Unique wind frames: $unique_wind_frames"
            test "$unique_wind_frames" -ge 2
          fi

      - name: Write QA metadata
        if: always()
        shell: bash
        run: |
          {
            echo "target_ref=$TARGET_REF"
            echo "workflow_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } > qa-metadata.txt

      - name: Upload Chromium QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-chromium-qa-${{ github.run_id }}
          path: |
            visual-qa/
            test-results/
            playwright-report/
            qa-metadata.txt
            /tmp/rainscope-preview.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish final Chromium QA status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [ -z "${TARGET_SHA:-}" ]; then
            echo "TARGET_SHA is unavailable; skip final commit status publication."
            exit 0
          fi

          case "$QA_JOB_STATUS" in
            success)
              STATE="success"
              DESCRIPTION="Branch Chromium QA passed (attempt $GITHUB_RUN_ATTEMPT)"
              ;;
            cancelled)
              STATE="error"
              DESCRIPTION="Branch Chromium QA cancelled (attempt $GITHUB_RUN_ATTEMPT)"
              ;;
            failure)
              STATE="failure"
              DESCRIPTION="Branch Chromium QA failed (attempt $GITHUB_RUN_ATTEMPT)"
              ;;
            *)
              STATE="error"
              DESCRIPTION="Branch Chromium QA ended with $QA_JOB_STATUS (attempt $GITHUB_RUN_ATTEMPT)"
              ;;
          esac

          curl --fail --silent --show-error \
            --request POST \
            --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"state\":\"$STATE\",\"target_url\":\"$RUN_URL\",\"description\":\"$DESCRIPTION\",\"context\":\"branch-chromium-qa\"}"
