name: Branch Chromium QA

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to validate
        required: true
        default: deckGL
        type: string
      expected_sha:
        description: Optional exact commit SHA expected for target_ref
        required: false
        default: ''
        type: string
      qa_mode:
        description: Functional runs deterministic + E2E gates; full also captures visual evidence
        required: true
        default: full
        type: choice
        options:
          - functional
          - full
      issue_number:
        description: Optional GitHub Issue number for orchestration correlation
        required: false
        default: ''
        type: string
      request_id:
        description: Optional caller-generated correlation ID
        required: false
        default: ''
        type: string
  push:
    branches-ignore:
      - deckGL

permissions:
  contents: read
  statuses: write

concurrency:
  group: branch-chromium-qa-${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref_name }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '' }}
      QA_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.qa_mode || 'functional' }}
      ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || '' }}
      REQUEST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || '' }}
      QA_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Resolve QA contract
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="$(git rev-parse HEAD)"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          EFFECTIVE_REQUEST_ID="${REQUEST_ID:-run-$GITHUB_RUN_ID}"

          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "RUN_URL=$RUN_URL" >> "$GITHUB_ENV"
          echo "EFFECTIVE_REQUEST_ID=$EFFECTIVE_REQUEST_ID" >> "$GITHUB_ENV"

          mkdir -p qa
          export TARGET_SHA RUN_URL EFFECTIVE_REQUEST_ID

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const contract = {
            schemaVersion: 1,
            workflow: 'branch-chromium-qa',
            request: {
              requestId: process.env.EFFECTIVE_REQUEST_ID,
              issueNumber: process.env.ISSUE_NUMBER || null,
              targetRef: process.env.TARGET_REF,
              expectedSha: process.env.EXPECTED_SHA || null,
              mode: process.env.QA_MODE,
            },
            execution: {
              eventName: process.env.GITHUB_EVENT_NAME,
              runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              runUrl: process.env.RUN_URL,
            },
            target: {
              sha: process.env.TARGET_SHA,
            },
          };

          fs.writeFileSync('qa/qa-contract.json', `${JSON.stringify(contract, null, 2)}\n`);
          NODE

          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$TARGET_SHA" ]; then
            echo "Expected SHA $EXPECTED_SHA but $TARGET_REF resolved to $TARGET_SHA" >&2
            exit 1
          fi

      - name: Publish Chromium QA run locator
        if: steps.resolve.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --request POST \
            --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"state\":\"pending\",\"target_url\":\"$RUN_URL\",\"description\":\"Chromium QA $QA_MODE running (attempt $GITHUB_RUN_ATTEMPT)\",\"context\":\"branch-chromium-qa\"}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm --version

      - name: Install project dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Run deterministic validation
        id: verify
        run: pnpm verify

      - name: Install Chromium browser
        id: browser_install
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium functional E2E
        id: e2e
        run: pnpm test:e2e

      - name: Start local production preview
        id: preview
        if: env.QA_MODE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm preview --host 127.0.0.1 --port 4173 > /tmp/rainscope-preview.log 2>&1 &
          echo $! > /tmp/rainscope-preview.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$QA_BASE_URL" >/dev/null; then
              echo "Preview ready at $QA_BASE_URL"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/rainscope-preview.log || true
          exit 1

      - name: Capture real Chromium visual QA evidence
        id: visual_capture
        if: env.QA_MODE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-qa/desktop visual-qa/wind

          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';

          const baseUrl = process.env.QA_BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const summary = {
            schemaVersion: 1,
            targetRef: process.env.TARGET_REF,
            targetSha: process.env.TARGET_SHA,
            viewports: [],
            dynamicFrames: [],
          };

          async function openReadyPage(width, height) {
            const page = await browser.newPage({ viewport: { width, height } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto(baseUrl, { waitUntil: 'domcontentloaded', timeout: 60_000 });
            await page.waitForTimeout(5_000);
            if (pageErrors.length > 0) {
              throw new Error(`Page errors at ${width}x${height}: ${pageErrors.join(' | ')}`);
            }
            return page;
          }

          for (const [width, height] of [[1920, 1080], [1536, 1024], [1440, 900]]) {
            const page = await openReadyPage(width, height);
            const dashboard = page.locator('.weather-dashboard');
            const header = page.locator('.weather-header');
            const actionButtons = page.locator('.weather-header__actions button');

            if (await dashboard.count() !== 1 || await header.count() !== 1) {
              throw new Error(`Dashboard/header missing at ${width}x${height}`);
            }
            if (await actionButtons.count() !== 2) {
              throw new Error(`Expected 2 header action buttons at ${width}x${height}`);
            }

            const actions = await actionButtons.evaluateAll(buttons => buttons.map(button => {
              const label = button.querySelector('span');
              const labelRects = label ? label.getClientRects().length : 0;
              const style = getComputedStyle(button);
              const rect = button.getBoundingClientRect();
              return {
                text: label?.textContent?.trim() ?? '',
                labelRects,
                whiteSpace: style.whiteSpace,
                width: rect.width,
                height: rect.height,
              };
            }));

            for (const action of actions) {
              if (action.labelRects !== 1) {
                throw new Error(`Header action "${action.text}" wraps at ${width}x${height}`);
              }
            }

            const layout = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              scrollHeight: document.documentElement.scrollHeight,
              clientHeight: document.documentElement.clientHeight,
            }));

            if (layout.scrollWidth > layout.clientWidth + 1) {
              throw new Error(`Horizontal overflow at ${width}x${height}: ${layout.scrollWidth} > ${layout.clientWidth}`);
            }

            const screenshot = path.join('visual-qa', 'desktop', `${width}x${height}.png`);
            await page.screenshot({ path: screenshot, fullPage: true });

            summary.viewports.push({ width, height, screenshot, actions, layout });
            await page.close();
          }

          const windPage = await openReadyPage(1536, 1024);
          const windToggle = windPage.getByLabel('风场流线');
          if (await windToggle.count() === 1) {
            if (!(await windToggle.isChecked())) {
              await windToggle.check();
            }
            await windPage.waitForTimeout(600);

            const samples = [
              ['0000ms', 0],
              ['0120ms', 120],
              ['0240ms', 120],
              ['0600ms', 360],
              ['1800ms', 1200],
            ];

            for (const [name, waitMs] of samples) {
              if (waitMs > 0) await windPage.waitForTimeout(waitMs);
              const file = path.join('visual-qa', 'wind', `frame-${name}.png`);
              await windPage.screenshot({ path: file, fullPage: true });
              summary.dynamicFrames.push(file);
            }
          }
          await windPage.close();
          await browser.close();

          fs.writeFileSync('visual-qa/visual-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          NODE

      - name: Sanity-check visual artifacts
        id: visual_sanity
        if: env.QA_MODE == 'full'
        shell: bash
        run: |
          set -euo pipefail

          desktop_count=$(find visual-qa/desktop -type f -name '*.png' | wc -l)
          test "$desktop_count" -eq 3

          while IFS= read -r file; do
            size=$(stat -c%s "$file")
            echo "$file: $size bytes"
            test "$size" -gt 50000
          done < <(find visual-qa -type f -name '*.png' | sort)

          wind_count=$(find visual-qa/wind -type f -name '*.png' | wc -l)
          if [ "$wind_count" -gt 1 ]; then
            unique_wind_frames=$(sha256sum visual-qa/wind/*.png | awk '{print $1}' | sort -u | wc -l)
            echo "Unique wind frames: $unique_wind_frames"
            test "$unique_wind_frames" -ge 2
          fi

      - name: Write machine-readable QA summary
        if: always()
        shell: bash
        env:
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BROWSER_INSTALL_OUTCOME: ${{ steps.browser_install.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          VISUAL_CAPTURE_OUTCOME: ${{ steps.visual_capture.outcome }}
          VISUAL_SANITY_OUTCOME: ${{ steps.visual_sanity.outcome }}
        run: |
          set -euo pipefail
          mkdir -p qa/logs
          if [ -f /tmp/rainscope-preview.log ]; then
            cp /tmp/rainscope-preview.log qa/logs/preview.log
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const stages = {
            resolve: process.env.RESOLVE_OUTCOME || 'not_run',
            install: process.env.INSTALL_OUTCOME || 'not_run',
            deterministic: process.env.VERIFY_OUTCOME || 'not_run',
            browserInstall: process.env.BROWSER_INSTALL_OUTCOME || 'not_run',
            functionalE2E: process.env.E2E_OUTCOME || 'not_run',
            preview: process.env.PREVIEW_OUTCOME || 'not_run',
            visualCapture: process.env.VISUAL_CAPTURE_OUTCOME || 'not_run',
            visualSanity: process.env.VISUAL_SANITY_OUTCOME || 'not_run',
          };

          const requiredStages = [
            stages.resolve,
            stages.install,
            stages.deterministic,
            stages.browserInstall,
            stages.functionalE2E,
          ];
          if (process.env.QA_MODE === 'full') {
            requiredStages.push(stages.preview, stages.visualCapture, stages.visualSanity);
          }

          const result = requiredStages.every(outcome => outcome === 'success')
            ? 'success'
            : 'failure';

          const summary = {
            schemaVersion: 1,
            workflow: 'branch-chromium-qa',
            request: {
              requestId: process.env.EFFECTIVE_REQUEST_ID || process.env.REQUEST_ID || `run-${process.env.GITHUB_RUN_ID}`,
              issueNumber: process.env.ISSUE_NUMBER || null,
              targetRef: process.env.TARGET_REF,
              expectedSha: process.env.EXPECTED_SHA || null,
              mode: process.env.QA_MODE,
            },
            execution: {
              eventName: process.env.GITHUB_EVENT_NAME,
              runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              runUrl: process.env.RUN_URL || `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            },
            target: {
              sha: process.env.TARGET_SHA || null,
            },
            result,
            stages,
            evidence: {
              playwrightReport: 'playwright-report/',
              testResults: 'test-results/',
              visualSummary: process.env.QA_MODE === 'full' ? 'visual-qa/visual-summary.json' : null,
              desktopScreenshots: process.env.QA_MODE === 'full' ? 'visual-qa/desktop/' : null,
              dynamicFrames: process.env.QA_MODE === 'full' ? 'visual-qa/wind/' : null,
              previewLog: fs.existsSync('qa/logs/preview.log') ? 'qa/logs/preview.log' : null,
            },
          };

          fs.writeFileSync('qa/qa-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          NODE

      - name: Upload Chromium QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-chromium-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/
            visual-qa/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish final Chromium QA status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [ -z "${TARGET_SHA:-}" ]; then
            echo "TARGET_SHA is unavailable; skip final commit status publication."
            exit 0
          fi

          case "$QA_JOB_STATUS" in
            success)
              STATE="success"
              DESCRIPTION="Chromium QA $QA_MODE passed (attempt $GITHUB_RUN_ATTEMPT)"
              ;;
            cancelled)
              STATE="error"
              DESCRIPTION="Chromium QA $QA_MODE cancelled (attempt $GITHUB_RUN_ATTEMPT)"
              ;;
            failure)
              STATE="failure"
              DESCRIPTION="Chromium QA $QA_MODE failed (attempt $GITHUB_RUN_ATTEMPT)"
              ;;
            *)
              STATE="error"
              DESCRIPTION="Chromium QA $QA_MODE ended with $QA_JOB_STATUS"
              ;;
          esac

          curl --fail --silent --show-error \
            --request POST \
            --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"state\":\"$STATE\",\"target_url\":\"$RUN_URL\",\"description\":\"$DESCRIPTION\",\"context\":\"branch-chromium-qa\"}"
