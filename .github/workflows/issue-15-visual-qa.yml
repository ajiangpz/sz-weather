name: Issue 15 Visual QA

on:
  push:
    branches:
      - fix/issue-15-radar-texture

permissions:
  contents: read
  issues: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Install Playwright Chromium
        run: |
          pnpm add -D playwright@1.54.2 --lockfile=false
          pnpm exec playwright install --with-deps chromium

      - name: Start preview
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 > /tmp/rainscope-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rainscope-preview.log
          exit 1

      - name: Capture real Chromium evidence
        run: |
          mkdir -p visual-evidence
          cat > ./issue15-visual.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const baseURL = 'http://127.0.0.1:4173/';
          const results = [];

          for (const [width, height] of [[1920,1080],[1536,1024],[1440,900]]) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(baseURL, { waitUntil: 'networkidle' });
            await page.waitForTimeout(900);
            await page.screenshot({ path: `visual-evidence/viewport-${width}x${height}.png`, fullPage: true });
            const map = page.locator('.weather-map-panel');
            await map.screenshot({ path: `visual-evidence/map-${width}x${height}.png` });
            results.push({ kind: 'viewport', width, height, mapBox: await map.boundingBox() });
            await page.close();
          }

          const page = await browser.newPage({ viewport: { width: 1536, height: 1024 } });
          await page.goto(baseURL, { waitUntil: 'networkidle' });
          await page.waitForTimeout(700);
          await page.getByRole('button', { name: '播放' }).click();
          const times = [0, 600, 1200, 2400, 3600];
          let elapsed = 0;
          const hashes = [];
          for (const t of times) {
            await page.waitForTimeout(t - elapsed);
            elapsed = t;
            const path = `visual-evidence/radar-playback-${t}ms.png`;
            await page.locator('.weather-map-panel').screenshot({ path });
            const hash = createHash('sha256').update(readFileSync(path)).digest('hex');
            const frameTime = await page.locator('.weather-map-panel__time').innerText();
            hashes.push({ t, hash, frameTime });
          }
          await page.getByRole('button', { name: '暂停' }).click();
          results.push({ kind: 'dynamic', hashes, distinct: new Set(hashes.map((item) => item.hash)).size, distinctTimes: new Set(hashes.map((item) => item.frameTime)).size });
          writeFileSync('visual-evidence/results.json', JSON.stringify(results, null, 2));
          if (new Set(hashes.map((item) => item.hash)).size < 4) throw new Error('Radar playback frames did not change sufficiently');
          if (new Set(hashes.map((item) => item.frameTime)).size < 3) throw new Error('Timeline did not advance across radar playback samples');
          await browser.close();
          EOF
          node ./issue15-visual.mjs
          cat visual-evidence/results.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-15-visual-evidence-${{ github.run_id }}
          path: |
            visual-evidence
            /tmp/rainscope-preview.log
          if-no-files-found: warn
          retention-days: 7

      - name: Comment run result on Issue 15
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f visual-evidence/results.json ]; then RESULT="$(cat visual-evidence/results.json)"; else RESULT="visual evidence was not produced"; fi
          BODY=$(cat <<EOF
          ## Issue #15 Chromium Visual QA harness

          Run ID: \`$RUN_ID\`  
          Attempt: \`$RUN_ATTEMPT\`  
          Job status: \`$JOB_STATUS\`

          Real Playwright Chromium executed \`pnpm verify\`, captured 1920×1080 / 1536×1024 / 1440×900 full-page and map screenshots, and sampled timeline-driven radar playback at 0 / 600 / 1200 / 2400 / 3600 ms.

          Results:
          \`\`\`json
          $RESULT
          \`\`\`
          EOF
          )
          gh api repos/${{ github.repository }}/issues/15/comments -f body="$BODY"
