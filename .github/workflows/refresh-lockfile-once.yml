name: Refresh dependency lockfile once

on:
  push:
    branches:
      - agent/autonomy-foundation
    paths:
      - package.json
      - .github/workflows/refresh-lockfile-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/autonomy-foundation

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-lockfile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/refresh-lockfile-once.yml
          git commit -m "build: lock lint and Playwright dependencies"
          git push origin HEAD:agent/autonomy-foundation
