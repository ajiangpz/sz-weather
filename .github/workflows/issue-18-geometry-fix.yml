name: Issue 18 Geometry Fix

on:
  push:
    branches:
      - fix/issue-18-radar-seed
    paths:
      - .agent/issue18-geometry-fix-trigger.txt

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-18-radar-seed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply geometry-only visual repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mock/weather.ts')
          text = path.read_text()

          replacements = [
            ("""  ['severeStorm', 114.132, 22.519, 34.6],\n  ['severeStorm', 114.176, 22.557, 42.8],\n  ['storm', 114.223, 22.536, 28.4],\n  ['severeStorm', 114.348, 22.627, 35.2],\n  ['severeStorm', 114.401, 22.674, 41.3],\n  ['storm', 114.456, 22.646, 30.1],""",
             """  ['storm', 114.112, 22.512, 29.8],\n  ['severeStorm', 114.163, 22.565, 43.4],\n  ['storm', 114.232, 22.533, 26.7],\n  ['storm', 114.333, 22.612, 28.5],\n  ['severeStorm', 114.389, 22.681, 42.1],\n  ['storm', 114.468, 22.638, 27.6],"""),
            ("""const eastRainPath: Coordinate[] = [\n  [114.17, 22.45],\n  [114.25, 22.51],\n  [114.34, 22.57],\n  [114.43, 22.63],\n  [114.51, 22.7],\n];""",
             """const eastRainPath: Coordinate[] = [\n  [114.17, 22.45],\n  [114.238, 22.522],\n  [114.331, 22.566],\n  [114.398, 22.642],\n  [114.493, 22.676],\n  [114.525, 22.712],\n];"""),
            ("""const stormCorePath: Coordinate[] = [\n  [114.105, 22.522],\n  [114.146, 22.556],\n  [114.181, 22.53],\n  [114.219, 22.567],\n  [114.251, 22.544],\n];""",
             """const stormCorePath: Coordinate[] = [\n  [114.102, 22.516],\n  [114.131, 22.555],\n  [114.176, 22.537],\n  [114.191, 22.568],\n  [114.248, 22.532],\n];"""),
            ("""  ...createBandCells('storm', 27.6, stormCorePath, coreOffsets),\n  ...createBandCells('severeStorm', 39.2, [[114.129, 22.515], [114.174, 22.556], [114.218, 22.535]], coreOffsets),\n  ...createBandCells('severeStorm', 37.8, [[114.346, 22.626], [114.397, 22.675], [114.454, 22.646]], coreOffsets),""",
             """  ...createBandCells('storm', 27.6, stormCorePath, coreOffsets),\n  ...createBandCells('severeStorm', 39.2, [[114.126, 22.553], [114.188, 22.568], [114.236, 22.526]], coreOffsets),\n  ...createBandCells('severeStorm', 37.8, [[114.337, 22.618], [114.382, 22.679], [114.459, 22.641]], coreOffsets),"""),
            ("""const luohuCoreCenters: Coordinate[] = [\n  [114.092, 22.518],\n  [114.121, 22.551],\n  [114.151, 22.532],\n  [114.181, 22.562],\n  [114.213, 22.526],\n];""",
             """const luohuCoreCenters: Coordinate[] = [\n  [114.094, 22.518],\n  [114.124, 22.558],\n  [114.168, 22.538],\n  [114.187, 22.568],\n  [114.238, 22.527],\n];"""),
            ("""const pingshanCoreCenters: Coordinate[] = [\n  [114.313, 22.586],\n  [114.341, 22.632],\n  [114.378, 22.646],\n  [114.409, 22.681],\n  [114.459, 22.649],\n];""",
             """const pingshanCoreCenters: Coordinate[] = [\n  [114.319, 22.607],\n  [114.351, 22.658],\n  [114.397, 22.681],\n  [114.421, 22.646],\n  [114.474, 22.634],\n];"""),
            ("""const easternBurstCenters: Coordinate[] = [\n  [114.34, 22.61],\n  [114.38, 22.64],\n  [114.42, 22.66],\n  [114.46, 22.68],\n];""",
             """const easternBurstCenters: Coordinate[] = [\n  [114.329, 22.606],\n  [114.361, 22.656],\n  [114.418, 22.641],\n  [114.476, 22.682],\n];"""),
            ("""  ...createFragmentCells('severeStorm', 39.4, [[114.18, 22.495], [114.225, 22.512], [114.265, 22.535]], 0.008),""",
             """  ...createFragmentCells('severeStorm', 39.4, [[114.166, 22.503], [114.211, 22.534], [114.263, 22.517]], 0.008),"""),
            ("""        [114.168, 22.488],\n        [114.206, 22.508],\n        [114.244, 22.529],\n        [114.34, 22.624],""",
             """        [114.157, 22.496],\n        [114.203, 22.531],\n        [114.258, 22.516],\n        [114.334, 22.613],"""),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected geometry block not found:\n{old}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Strengthen bead-chain regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mock/weather.test.ts')
          text = path.read_text()
          old = """      expect(Math.max(...adjacentGaps) - Math.min(...adjacentGaps)).toBeGreaterThan(0.008);\n      expect(uniqueIntensityBands.size).toBeGreaterThanOrEqual(4);"""
          new = """      expect(Math.max(...adjacentGaps) - Math.min(...adjacentGaps)).toBeGreaterThan(0.012);\n      expect(Math.max(...adjacentGaps)).toBeGreaterThan(0.02);\n      expect(uniqueIntensityBands.size).toBeGreaterThanOrEqual(4);"""
          if old not in text:
            raise SystemExit('Expected radar bead-chain test block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify patched implementation
        run: pnpm verify

      - name: Commit geometry repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mock/weather.ts src/mock/weather.test.ts
          git commit -m "fix(radar): break remaining warm-core bead cadence"
          git push origin HEAD:fix/issue-18-radar-seed
