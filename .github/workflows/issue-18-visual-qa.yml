name: Issue 18 Visual QA

on:
  push:
    branches:
      - fix/issue-18-radar-seed

permissions:
  contents: write
  issues: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Issue 18 implementation
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/mock/weather.ts')
          text = path.read_text()

          replacements = [
            ("""  ['severeStorm', 114.19, 22.53, 37.4],\n  ['severeStorm', 114.22, 22.55, 42.6],\n  ['storm', 114.26, 22.58, 30.8],\n  ['severeStorm', 114.38, 22.64, 36.8],\n  ['severeStorm', 114.42, 22.66, 39.6],\n  ['storm', 114.46, 22.68, 31.2],""",
             """  ['severeStorm', 114.132, 22.519, 34.6],\n  ['severeStorm', 114.176, 22.557, 42.8],\n  ['storm', 114.223, 22.536, 28.4],\n  ['severeStorm', 114.348, 22.627, 35.2],\n  ['severeStorm', 114.401, 22.674, 41.3],\n  ['storm', 114.456, 22.646, 30.1],"""),
            ("""const coreOffsets = [\n  [-0.018, -0.014, -2],\n  [0, 0, 0],\n  [0.019, 0.016, -1.4],\n] as const;""",
             """const coreOffsets = [\n  [-0.018, -0.014, -2],\n  [0, 0, 0],\n  [0.019, 0.016, -1.4],\n] as const;\n\nconst strongCoreOffsets = [\n  [-0.021, -0.006, -4.1],\n  [-0.006, 0.014, -1.2],\n  [0.013, -0.012, 0],\n  [0.026, 0.009, -2.6],\n] as const;"""),
            ("""const stormCorePath: Coordinate[] = [\n  [114.13, 22.525],\n  [114.165, 22.54],\n  [114.2, 22.552],\n  [114.23, 22.56],\n];""",
             """const stormCorePath: Coordinate[] = [\n  [114.105, 22.522],\n  [114.146, 22.556],\n  [114.181, 22.53],\n  [114.219, 22.567],\n  [114.251, 22.544],\n];"""),
            ("""  ...createBandCells('storm', 27.6, stormCorePath, coreOffsets),\n  ...createBandCells('severeStorm', 39.2, [[114.14, 22.525], [114.18, 22.54], [114.21, 22.555]], coreOffsets),\n  ...createBandCells('severeStorm', 37.8, [[114.37, 22.64], [114.41, 22.66], [114.45, 22.675]], coreOffsets),""",
             """  ...createBandCells('storm', 27.6, stormCorePath, strongCoreOffsets),\n  ...createBandCells('severeStorm', 39.2, [[114.129, 22.515], [114.174, 22.556], [114.218, 22.535]], strongCoreOffsets),\n  ...createBandCells('severeStorm', 37.8, [[114.346, 22.626], [114.397, 22.675], [114.454, 22.646]], strongCoreOffsets),"""),
            ("""const luohuCoreCenters: Coordinate[] = [\n  [114.095, 22.525],\n  [114.118, 22.545],\n  [114.145, 22.535],\n  [114.166, 22.555],\n  [114.19, 22.525],\n];""",
             """const luohuCoreCenters: Coordinate[] = [\n  [114.092, 22.518],\n  [114.121, 22.551],\n  [114.151, 22.532],\n  [114.181, 22.562],\n  [114.213, 22.526],\n];"""),
            ("""const pingshanCoreCenters: Coordinate[] = [\n  [114.315, 22.59],\n  [114.345, 22.625],\n  [114.382, 22.642],\n  [114.41, 22.675],\n  [114.455, 22.655],\n];""",
             """const pingshanCoreCenters: Coordinate[] = [\n  [114.313, 22.586],\n  [114.341, 22.632],\n  [114.378, 22.646],\n  [114.409, 22.681],\n  [114.459, 22.649],\n];"""),
            ("""const innerBurstCenters: Coordinate[] = [\n  [114.075, 22.505],\n  [114.104, 22.526],\n  [114.137, 22.548],\n  [114.198, 22.548],\n  [114.258, 22.565],\n  [114.333, 22.612],\n  [114.382, 22.638],\n  [114.428, 22.66],\n];""",
             """const innerBurstCenters: Coordinate[] = [\n  [114.074, 22.499],\n  [114.111, 22.532],\n  [114.142, 22.552],\n  [114.194, 22.54],\n  [114.263, 22.572],\n  [114.328, 22.606],\n  [114.386, 22.651],\n  [114.435, 22.655],\n];"""),
          ]

          for old, new in replacements:
            if old in text:
              text = text.replace(old, new, 1)
            elif new not in text:
              raise SystemExit(f'Expected Issue 18 source block not found: {old[:80]!r}')

          path.write_text(text)

          test_path = Path('src/mock/weather.test.ts')
          test_text = test_path.read_text()
          marker = "breaks strong radar cells into uneven two-dimensional clusters instead of bead chains"
          if marker not in test_text:
            insert = r'''

  it('breaks strong radar cells into uneven two-dimensional clusters instead of bead chains', () => {
    const strongCells = mockRadarGeoJson.features.filter((feature) => feature.properties.intensity >= 24);
    const clusters = [
      strongCells.filter((feature) => {
        const [longitude, latitude] = feature.geometry.coordinates;
        return longitude >= 114.08 && longitude <= 114.28 && latitude >= 22.49 && latitude <= 22.59;
      }),
      strongCells.filter((feature) => {
        const [longitude, latitude] = feature.geometry.coordinates;
        return longitude >= 114.32 && longitude <= 114.49 && latitude >= 22.60 && latitude <= 22.71;
      }),
    ];

    clusters.forEach((cluster) => {
      const sortedLongitudes = cluster
        .map((feature) => feature.geometry.coordinates[0])
        .sort((a, b) => a - b);
      const latitudeValues = cluster.map((feature) => feature.geometry.coordinates[1]);
      const adjacentGaps = sortedLongitudes.slice(1).map((longitude, index) => longitude - sortedLongitudes[index]);
      const uniqueIntensityBands = new Set(cluster.map((feature) => Math.round(feature.properties.intensity)));

      expect(cluster.length).toBeGreaterThanOrEqual(8);
      expect(Math.max(...latitudeValues) - Math.min(...latitudeValues)).toBeGreaterThan(0.035);
      expect(Math.max(...adjacentGaps) - Math.min(...adjacentGaps)).toBeGreaterThan(0.008);
      expect(uniqueIntensityBands.size).toBeGreaterThanOrEqual(4);
    });
  });
'''
            test_text = test_text.rstrip()
            if not test_text.endswith('});'):
              raise SystemExit('Unexpected weather.test.ts ending')
            test_text = test_text[:-3] + insert + '\n});\n'
            test_path.write_text(test_text)
          PY

          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/mock/weather.ts src/mock/weather.test.ts
            git commit -m "visual: break up radar storm core bead chains"
            git push origin HEAD:fix/issue-18-radar-seed
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Install Playwright Chromium
        run: |
          pnpm add -D playwright@1.54.2 --lockfile=false
          pnpm exec playwright install --with-deps chromium

      - name: Start preview
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 > /tmp/rainscope-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rainscope-preview.log
          exit 1

      - name: Capture real Chromium evidence
        run: |
          mkdir -p visual-evidence
          cat > ./issue18-visual.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const baseURL = 'http://127.0.0.1:4173/';
          const results = [];

          for (const [width, height] of [[1920,1080],[1536,1024],[1440,900]]) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(baseURL, { waitUntil: 'networkidle' });
            await page.waitForTimeout(900);
            await page.screenshot({ path: `visual-evidence/viewport-${width}x${height}.png`, fullPage: true });
            const map = page.locator('.weather-map-panel');
            await map.screenshot({ path: `visual-evidence/map-${width}x${height}.png` });
            results.push({ kind: 'viewport', width, height, mapBox: await map.boundingBox() });
            await page.close();
          }

          const page = await browser.newPage({ viewport: { width: 1536, height: 1024 } });
          await page.goto(baseURL, { waitUntil: 'networkidle' });
          await page.waitForTimeout(700);
          await page.getByLabel('风场流线').check();
          await page.getByRole('button', { name: '播放', exact: true }).click();
          const times = [0, 600, 1200, 2400, 3600];
          let elapsed = 0;
          const hashes = [];
          for (const t of times) {
            await page.waitForTimeout(t - elapsed);
            elapsed = t;
            const file = `visual-evidence/radar-wind-${t}ms.png`;
            await page.locator('.weather-map-panel').screenshot({ path: file });
            const hash = createHash('sha256').update(readFileSync(file)).digest('hex');
            const frameTime = await page.locator('.weather-map-panel__time').innerText();
            hashes.push({ t, hash, frameTime });
          }
          await page.getByRole('button', { name: '暂停', exact: true }).click();
          results.push({
            kind: 'dynamic',
            hashes,
            distinct: new Set(hashes.map((item) => item.hash)).size,
            distinctTimes: new Set(hashes.map((item) => item.frameTime)).size,
          });
          writeFileSync('visual-evidence/results.json', JSON.stringify(results, null, 2));
          if (new Set(hashes.map((item) => item.hash)).size < 4) throw new Error('Radar/wind playback frames did not change sufficiently');
          if (new Set(hashes.map((item) => item.frameTime)).size < 3) throw new Error('Timeline did not advance across radar samples');
          await browser.close();
          EOF
          node ./issue18-visual.mjs
          cat visual-evidence/results.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-18-visual-evidence-${{ github.run_id }}
          path: |
            visual-evidence
            /tmp/rainscope-preview.log
          if-no-files-found: warn
          retention-days: 7

      - name: Comment run result on Issue 18
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f visual-evidence/results.json ]; then RESULT="$(cat visual-evidence/results.json)"; else RESULT="visual evidence was not produced"; fi
          BODY=$(cat <<EOF
          ## Issue #18 Chromium Visual QA harness

          Run ID: \`$RUN_ID\`  
          Attempt: \`$RUN_ATTEMPT\`  
          Job status: \`$JOB_STATUS\`

          Real Playwright Chromium executed \`pnpm verify\`, captured 1920×1080 / 1536×1024 / 1440×900 full-page and map screenshots, enabled the wind field, and sampled timeline-driven radar/wind playback at 0 / 600 / 1200 / 2400 / 3600 ms.

          Results:
          \`\`\`json
          $RESULT
          \`\`\`
          EOF
          )
          gh api repos/${{ github.repository }}/issues/18/comments -f body="$BODY"
