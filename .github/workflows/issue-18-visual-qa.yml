name: Issue 18 Visual QA

on:
  push:
    branches:
      - fix/issue-18-radar-seed

permissions:
  contents: write
  issues: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-18-radar-seed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply pending clustered warm-core refinement
        run: python .agent/issue18-refine.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Install Playwright Chromium
        run: |
          pnpm add -D @playwright/test@1.54.2 playwright@1.54.2 --lockfile=false
          pnpm exec playwright install --with-deps chromium

      - name: Run Chromium E2E
        env:
          CI: "1"
        run: pnpm exec playwright test tests/e2e/dashboard.spec.mjs --config=playwright.config.mjs --project=chromium

      - name: Start production preview
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 > /tmp/rainscope-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rainscope-preview.log
          exit 1

      - name: Capture real Chromium evidence
        run: |
          mkdir -p visual-evidence
          node .agent/issue18-visual.mjs
          cat visual-evidence/results.json

      - name: Commit validated product geometry if changed
        run: |
          if git diff --quiet -- src/mock/weather.ts; then
            echo "No product geometry commit needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mock/weather.ts
          git commit -m "fix(radar): consolidate warm cores into uneven clusters"
          git push origin HEAD:fix/issue-18-radar-seed

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-18-visual-evidence-${{ github.run_id }}
          path: |
            visual-evidence
            playwright-report
            test-results
            /tmp/rainscope-preview.log
          if-no-files-found: warn
          retention-days: 7

      - name: Comment run result on Issue 18
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: gh api repos/${{ github.repository }}/issues/18/comments -f body="Issue #18 Chromium Visual QA run \`$RUN_ID\`: **$JOB_STATUS**. Three desktop viewports plus dynamic radar/wind frames were exercised; evidence is attached to the workflow run."
