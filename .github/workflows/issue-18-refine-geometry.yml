name: Issue 18 Refine Geometry

on:
  push:
    branches:
      - fix/issue-18-radar-seed
    paths:
      - .agent/issue18-refine-v2-trigger.txt

permissions:
  contents: write
  issues: write

jobs:
  refine-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-18-radar-seed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply clustered warm-core refinement
        run: python -c "import base64;exec(base64.b64decode(''))"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify refined geometry
        run: pnpm verify

      - name: Commit tested refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mock/weather.ts
          git commit -m "fix(radar): consolidate warm cores into uneven clusters"
          git push origin HEAD:fix/issue-18-radar-seed

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: gh api repos/${{ github.repository }}/issues/18/comments -f body="Issue #18 refine-geometry run \`$RUN_ID\`: **$JOB_STATUS**."
