name: Create Codex Issue

on:
  schedule:
    # GitHub cron uses UTC. 00:50 UTC = 08:50 China Standard Time (UTC+8).
    - cron: "50 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout deckGL
        uses: actions/checkout@v4
        with:
          ref: deckGL

      - name: Ensure codex-ready label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create codex-ready \
            --color "1D76DB" \
            --description "Ready for autonomous Codex development" \
            --force

      - name: Stop when Codex already has a queued issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          COUNT=$(gh issue list \
            --state open \
            --label codex-ready \
            --limit 1 \
            --json number \
            --jq 'length')

          if [ "$COUNT" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "An open codex-ready issue already exists; no new issue will be created."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find next automation-queue task
        if: steps.existing.outputs.skip == 'false'
        id: task
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('docs/CODEX_TASKS.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Automation Queue'

          if marker not in text:
              raise SystemExit('Automation Queue section not found in docs/CODEX_TASKS.md')

          queue = text.split(marker, 1)[1]
          task = None
          for line in queue.splitlines():
              if line.startswith('- [ ] '):
                  task = line[6:].strip()
                  break

          output = Path(__import__('os').environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as fh:
              if task:
                  fh.write('has_task=true\n')
                  fh.write(f'title={task}\n')
              else:
                  fh.write('has_task=false\n')
          PY

      - name: Create codex-ready issue
        if: steps.existing.outputs.skip == 'false' && steps.task.outputs.has_task == 'true'
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_TITLE: ${{ steps.task.outputs.title }}
        shell: bash
        run: |
          BODY=$(cat <<EOF
          ## Background

          This Issue was created automatically from the **Automation Queue** in `docs/CODEX_TASKS.md`.

          ## Requirement

          ${TASK_TITLE}

          ## Acceptance Criteria

          - Implement the requested behavior with the smallest complete change.
          - Follow `AGENTS.md` and the repository project documentation.
          - Add or update tests for changed logic where practical.
          - `pnpm verify` passes.
          - Run Playwright Chromium E2E checks when user-visible UI, map, chart, timeline, interaction, or responsive behavior is affected.
          - Do not introduce unrelated refactors or dependencies.
          - Open a PR against `deckGL`; do not merge automatically.

          ## Source

          Generated by `.github/workflows/create-codex-issue.yml`.
          EOF
          )

          URL=$(gh issue create \
            --title "$TASK_TITLE" \
            --label codex-ready \
            --body "$BODY")

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Created: $URL"

      - name: Mark queue task as issued
        if: steps.issue.outputs.url != ''
        env:
          TASK_TITLE: ${{ steps.task.outputs.title }}
        shell: bash
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          path = Path('docs/CODEX_TASKS.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Automation Queue'
          before, queue = text.split(marker, 1)

          title = os.environ['TASK_TITLE']
          old = f'- [ ] {title}'
          new = f'- [x] {title}'

          if old not in queue:
              raise SystemExit(f'Queue item not found after Issue creation: {title}')

          queue = queue.replace(old, new, 1)
          path.write_text(before + marker + queue, encoding='utf-8')
          PY

      - name: Commit queue progress
        if: steps.issue.outputs.url != ''
        env:
          TASK_TITLE: ${{ steps.task.outputs.title }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CODEX_TASKS.md
          git commit -m "chore: queue Codex task ${TASK_TITLE}"
          git push origin HEAD:deckGL
