name: Issue 18 Refine And Visual

on:
  push:
    branches:
      - fix/issue-18-radar-seed
    paths:
      - .agent/issue18-refine-trigger.txt

permissions:
  contents: write
  issues: write

jobs:
  refine-and-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-18-radar-seed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply clustered warm-core refinement
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/mock/weather.ts')
          text = path.read_text()
          replacements = [
            ("""  ['storm', 114.112, 22.512, 29.8],
  ['severeStorm', 114.163, 22.565, 43.4],
  ['storm', 114.232, 22.533, 26.7],
  ['storm', 114.333, 22.612, 28.5],
  ['severeStorm', 114.389, 22.681, 42.1],
  ['storm', 114.468, 22.638, 27.6],""",
             """  ['storm', 114.112, 22.538, 29.8],
  ['severeStorm', 114.128, 22.559, 43.4],
  ['storm', 114.203, 22.536, 26.7],
  ['storm', 114.349, 22.637, 28.5],
  ['severeStorm', 114.364, 22.662, 42.1],
  ['storm', 114.445, 22.645, 27.6],"""),
            ("""const stormCorePath: Coordinate[] = [
  [114.108, 22.532],
  [114.128, 22.558],
  [114.198, 22.552],
  [114.222, 22.532],
];""",
             """const stormCorePath: Coordinate[] = [
  [114.108, 22.536],
  [114.126, 22.558],
  [114.142, 22.545],
  [114.198, 22.539],
  [114.214, 22.555],
];"""),
            ("""  ...createBandCells('heavy', 18.8, [[114.205, 22.495], [114.318, 22.58], [114.374, 22.642], [114.487, 22.662]], coreOffsets),
  ...createBandCells('storm', 27.6, [[114.112, 22.54], [114.202, 22.55]], coreOffsets),
  ...createBandCells('severeStorm', 39.2, [[114.129, 22.552], [114.199, 22.557]], coreOffsets),
  ...createBandCells('severeStorm', 37.8, [[114.356, 22.646], [114.447, 22.651]], coreOffsets),""",
             """  ...createBandCells('heavy', 18.8, [[114.205, 22.495], [114.318, 22.58], [114.374, 22.642], [114.487, 22.662]], coreOffsets),
  ...createBandCells('storm', 27.6, [[114.126, 22.549], [114.207, 22.543]], coreOffsets),
  ...createBandCells('severeStorm', 39.2, [[114.128, 22.557], [114.209, 22.545]], coreOffsets),
  ...createBandCells('severeStorm', 37.8, [[114.361, 22.653], [114.449, 22.653]], coreOffsets),"""),
            ("""const luohuCoreCenters: Coordinate[] = [
  [114.104, 22.528],
  [114.129, 22.558],
  [114.198, 22.553],
  [114.225, 22.528],
];""",
             """const luohuCoreCenters: Coordinate[] = [
  [114.112, 22.538],
  [114.128, 22.559],
  [114.141, 22.547],
  [114.201, 22.537],
  [114.216, 22.555],
];"""),
            ("""const pingshanCoreCenters: Coordinate[] = [
  [114.342, 22.628],
  [114.365, 22.662],
  [114.438, 22.646],
  [114.463, 22.674],
];""",
             """const pingshanCoreCenters: Coordinate[] = [
  [114.347, 22.637],
  [114.363, 22.662],
  [114.377, 22.648],
  [114.442, 22.644],
  [114.458, 22.671],
];"""),
            ("""const easternBurstCenters: Coordinate[] = [
  [114.336, 22.621],
  [114.363, 22.658],
  [114.441, 22.644],
  [114.468, 22.678],
];""",
             """const easternBurstCenters: Coordinate[] = [
  [114.348, 22.635],
  [114.365, 22.659],
  [114.444, 22.643],
  [114.459, 22.671],
];"""),
            ("""  ...createFragmentCells('severeStorm', 39.4, [[114.124, 22.551], [114.198, 22.554], [114.219, 22.529]], 0.008),""",
             """  ...createFragmentCells('severeStorm', 39.4, [[114.125, 22.557], [114.204, 22.544], [114.218, 22.532]], 0.008),"""),
            ("""        [114.119, 22.545],
        [114.207, 22.552],
        [114.227, 22.527],
        [114.349, 22.638],""",
             """        [114.121, 22.552],
        [114.205, 22.543],
        [114.219, 22.532],
        [114.357, 22.649],"""),
          ]
          changed = False
          for old, new in replacements:
            if old in text:
              text = text.replace(old, new, 1)
              changed = True
            elif new not in text:
              raise SystemExit(f'Neither old nor expected refined geometry block found:\n{old}')
          if not changed:
            raise SystemExit('Refinement was already present; refusing to create a no-op candidate commit')
          path.write_text(text)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Install Playwright Chromium
        run: |
          pnpm add -D @playwright/test@1.54.2 playwright@1.54.2 --lockfile=false
          pnpm exec playwright install --with-deps chromium

      - name: Run Chromium E2E
        env:
          CI: "1"
        run: pnpm exec playwright test tests/e2e/dashboard.spec.mjs --config=playwright.config.mjs --project=chromium

      - name: Start production preview
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 > /tmp/rainscope-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rainscope-preview.log
          exit 1

      - name: Capture real Chromium evidence
        run: |
          mkdir -p visual-evidence
          cat > ./issue18-refine-visual.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const baseURL = 'http://127.0.0.1:4173/';
          const results = [];
          async function enableWind(page) {
            const checkbox = page.getByRole('checkbox', { name: /风场流线/ });
            if (await checkbox.count()) {
              if (!(await checkbox.first().isChecked())) await checkbox.first().check({ force: true });
              return { method: 'checkbox', checked: await checkbox.first().isChecked() };
            }
            const switchControl = page.getByRole('switch', { name: /风场流线/ });
            if (await switchControl.count()) {
              const checked = await switchControl.first().getAttribute('aria-checked');
              if (checked !== 'true') await switchControl.first().click({ force: true });
              return { method: 'switch', checked: await switchControl.first().getAttribute('aria-checked') };
            }
            throw new Error('Unable to locate the 风场流线 control');
          }
          for (const [width, height] of [[1920,1080],[1536,1024],[1440,900]]) {
            const page = await browser.newPage({ viewport: { width, height } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto(baseURL, { waitUntil: 'networkidle' });
            await page.waitForTimeout(1000);
            await page.screenshot({ path: `visual-evidence/viewport-${width}x${height}.png`, fullPage: true });
            const map = page.locator('.weather-map-panel');
            await map.screenshot({ path: `visual-evidence/map-${width}x${height}.png` });
            const wind = await enableWind(page);
            await page.waitForTimeout(900);
            await map.screenshot({ path: `visual-evidence/map-wind-${width}x${height}.png` });
            results.push({ kind: 'viewport', width, height, mapBox: await map.boundingBox(), wind, pageErrors });
            if (pageErrors.length) throw new Error(`Page errors at ${width}x${height}: ${pageErrors.join(' | ')}`);
            await page.close();
          }
          const page = await browser.newPage({ viewport: { width: 1536, height: 1024 } });
          const dynamicErrors = [];
          page.on('pageerror', error => dynamicErrors.push(error.message));
          await page.goto(baseURL, { waitUntil: 'networkidle' });
          await page.waitForTimeout(800);
          const wind = await enableWind(page);
          await page.waitForTimeout(500);
          await page.getByRole('button', { name: '播放', exact: true }).click();
          const times = [0,600,1200,2400,3600];
          let elapsed = 0;
          const frames = [];
          for (const t of times) {
            await page.waitForTimeout(t - elapsed); elapsed = t;
            const p = `visual-evidence/radar-wind-playback-${t}ms.png`;
            await page.locator('.weather-map-panel').screenshot({ path: p });
            frames.push({ t, hash: createHash('sha256').update(readFileSync(p)).digest('hex'), frameTime: await page.locator('.weather-map-panel__time').innerText() });
          }
          await page.getByRole('button', { name: '暂停', exact: true }).click();
          const distinctHashes = new Set(frames.map(x => x.hash)).size;
          const distinctTimes = new Set(frames.map(x => x.frameTime)).size;
          results.push({ kind: 'dynamic', wind, frames, distinctHashes, distinctTimes, pageErrors: dynamicErrors });
          writeFileSync('visual-evidence/results.json', JSON.stringify(results, null, 2));
          if (dynamicErrors.length) throw new Error(dynamicErrors.join(' | '));
          if (distinctHashes < 4 || distinctTimes < 4) throw new Error('Dynamic visual assertions failed');
          await browser.close();
          EOF
          node ./issue18-refine-visual.mjs
          cat visual-evidence/results.json

      - name: Commit tested refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mock/weather.ts
          git commit -m "fix(radar): consolidate warm cores into uneven clusters"
          git push origin HEAD:fix/issue-18-radar-seed

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-18-refine-visual-${{ github.run_id }}
          path: |
            visual-evidence
            playwright-report
            test-results
            /tmp/rainscope-preview.log
          if-no-files-found: warn
          retention-days: 7

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f visual-evidence/results.json ]; then RESULT="$(cat visual-evidence/results.json)"; else RESULT="visual evidence was not produced"; fi
          BODY=$(cat <<EOF
          ## Issue #18 clustered refinement + Chromium validation

          Run ID: \`$RUN_ID\`  
          Job status: \`$JOB_STATUS\`

          This temporary workflow clustered the remaining warm-core seeds, ran \`pnpm verify\`, Chromium E2E, all three required viewports, wind-enabled screenshots, and five timeline-driven radar+wind frames. On technical success it committed the exact tested geometry to the branch.

          Results:
          \`\`\`json
          $RESULT
          \`\`\`
          EOF
          )
          gh api repos/${{ github.repository }}/issues/18/comments -f body="$BODY"
