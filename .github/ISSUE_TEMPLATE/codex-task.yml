name: Codex-ready task
description: Create an implementation task that an autonomous coding agent can execute and verify.
title: "[codex] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for tasks that are ready to be implemented by Codex or another coding agent.
        The task should be small enough for one branch and one pull request.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the user-visible or engineering outcome in one concise paragraph.
      placeholder: What should be true after this task is complete?
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background
      description: Explain the current behavior, problem, or product context the agent needs to understand.
      placeholder: What exists today, and why does it need to change?
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: List concrete implementation requirements. Avoid vague wording such as "optimize" without a measurable result.
      placeholder: |
        - Requirement 1
        - Requirement 2
        - Requirement 3
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define observable conditions that determine PASS or FAIL.
      placeholder: |
        - [ ] Functional behavior is correct
        - [ ] Relevant regression tests pass
        - [ ] pnpm verify passes
    validations:
      required: true

  - type: dropdown
    id: visual_qa
    attributes:
      label: Visual QA required?
      description: Select Yes for UI, map, chart, animation, layout, responsive, or other user-visible changes.
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: visual_requirements
    attributes:
      label: Visual / interaction requirements
      description: If Visual QA is required, describe the expected visual hierarchy, states, interactions, and relevant viewports or dynamic frames.
      placeholder: |
        Viewports:
        - 1920x1080
        - 1536x1024
        - 1440x900

        States / interactions:
        - default
        - enabled / disabled
        - loading / empty / error when relevant

  - type: textarea
    id: allowed_scope
    attributes:
      label: Allowed scope
      description: Name the files, components, modules, or call chain the agent may modify when known.
      placeholder: |
        Allowed:
        - src/components/...
        - related tests
    validations:
      required: true

  - type: textarea
    id: forbidden_scope
    attributes:
      label: Do not change
      description: Explicitly protect unrelated behavior or architecture from scope creep.
      placeholder: |
        Do not change:
        - map rendering architecture
        - unrelated stores
        - public API contracts

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      description: List prerequisite Issues, external services, credentials, or known blockers. Write "None" when there are none.
      placeholder: None
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: checkboxes
    id: readiness
    attributes:
      label: Ready for autonomous development
      description: All items should be checked before this task receives the codex-ready state.
      options:
        - label: The goal and acceptance criteria are specific enough to determine PASS or FAIL.
          required: true
        - label: The task can reasonably be completed in one branch and one pull request.
          required: true
        - label: Dependencies and protected scope are documented.
          required: true
        - label: Visual QA expectations are documented when the task changes user-visible behavior.
          required: true
